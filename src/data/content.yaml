- title: Ebony Memo
  id: ebony-memo
  imgSrc: /images/EbonyMemo.webp
  imgAlt: A gif trailer for Ebony Memo
  summary: |
    As a videogame enthusiast, I seek out interesting titles across platforms, mobile nevertheless. [Ebony Memo](https://ebonymemo.vercel.app/) is an arthouse videogame curator website for mobile devices, and also a full custom content management system of MERN stack.
  content: |
    The system consists of three parts:

    * **Backend** (NodeJS/Express, [source](https://github.com/JunoNgx/ebonymemo-backend-nodejs)): A serverless RESTful API handling CRUD operations and authorisations for data modification. The database is stored on MongoDB Atlas.

    * **Content management application** (React, [source](https://github.com/JunoNgx/ebonymemo-admin-react), [deployment](https://eleum-loyce.netlify.app/)): A simple web application used by contributors to create and edit content. While most of the content is not locked behind credentials and authorisations, data-modifying actions are. Due to its purpose, it is not mobile-responsive.

    * **Frontend** (NextJS, [source](https://github.com/JunoNgx/ebonymemo-frontend-next), [deployment](http://ebonymemo.com/)): The only publicised user-facing portion of the system. The vast majority of the content is server-side rendered and heavily optimized for SEO.

    This was my attempt to dive into full-stack development and was an enlightening experience.
  tags:
    - web development
    - progressive web app
    - nextjs
    - react
    - nodejs
  links:
    - label: home page
      url: https://ebonymemo.vercel.app/
      type: deployment


- title: Wonyun Trench Run
  id: wonyun-trench-run
  imgSrc: /images/wonyun_5.gif
  imgAlt: animated screenshot of the game Wonyun Trench Run
  summary: |
    A bullet hell with a gameplay emphasis on evasion and resource management over relentless firepower, built in Pico-8.
  content: |
    Inspired by the pacing and tension of some of the slower and more methodical shoot 'em up (aka SHMUP), I explored a less conventional path for the genre, where ammo is scarce and shooting is an extreme measure. Player expression and a high skill ceiling are preserved with ammo mining, where risky maneuvers can be performed to earn the resources to recover from dangerous situations.

    This was also my first dive into the very quirky and cozy ecosystem of Pico-8. With a full suite of tools covering nearly all aspects of game development, I was able to create assets in a productive and convenient manner, without the overhead of tool switching. The minimalistic nature and limitations of Pico-8 (which uses a highly limited subset of Lua) also made it an interesting challenge, both technically and artistically.

    From an engineering perspective, the technical highlight of the game is one of my first attempts to pursue a more structured programming methodology, beyond just correctness. The **entity-component-system** pattern was employed, which provided a modular system and facilitated design iteration. The project taught me that clean architecture often comes with performance trade-offs. The particle system eventually became a major performance bottleneck, as each particle was represented as a full entity.
  tags:
    - game development
    - lua
  links:
