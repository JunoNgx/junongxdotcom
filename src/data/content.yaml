- title: JustJot
  id: justjot
  imgSrc: /images/JustJotTrailer.webp
  imgAlt: Demonstration of the app JustJot
  summary: |
    A full-featured note-taking system meticulously built around a keyboard-first approach (because I've always wanted one), made with [React](https://react.dev/) and [PocketBase](https://pocketbase.io/).
  content: |
    JustJot is the serendipitous outcome of many things: my desire to work on a side project; my needs to efficiently use time and handle my multitude of interests (spending over 300 hours on this project to perform 10-second tasks more efficiently; such a programmer's classic); my encounter with the brilliantly designed [bmrks](https://bmrks.com/) (unfortunately, not open-source); and [Casey](https://caseykwokdinata.webflow.io/), my collaborator for this project, showing up a lot in the office.

    React and TypeScript were the de facto choice of new projects at the time this was developed (and probably still are). Breaking away from my usual tradition to write everything myself, a UI library (cues in [Mantine](https://mantine.dev/)) was used for the first time, which provided me with a lot of valuable insights and experiences. I was also introduced to the world of Backend-as-a-Service, as [PocketBase](https://pocketbase.io/) helmed the backend implementation.

    Most noteworthy of all, in an era surrounded by touchscreens and trackpads, the keyboard-first approach raised numerous interesting challenges, in terms of both design and engineering. Casey and I found ourselves in uncharted territory most of the times. With development tools overwhelmingly catered to pointer-based input devices, it was difficult to find examples and documentations I needed. A keystroke does not simply have an effect on JustJot's main input (which already does much more than one thing); it also manages the app, and even the browser or even the operating system itself.

    JustJot is arguably my most impactful and valuable project yet: this is an application I use everyday for many tasks, including the development of projects that came after it.

    (If you have read this far, then something exciting is coming in 2026)
